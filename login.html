<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Admin Portal | PhilTechGMA</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (for eye toggle) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Login CSS -->
    <link rel="stylesheet" href="styles/login.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card col-md-6 col-lg-5 col-xl-4">
            <div class="login-header">
                <!-- Logo from image/logo.png -->
                <img src="logo.png" alt="Admin Portal Logo" class="login-logo mb-3">
                <h2 class="mb-1">Admin Login</h2>
                <p class="branch-text mb-1">✦ Administrator Portal ✦</p>
                <p class="mb-0 opacity-75">Secure access to PhilTechGMA dashboard</p>
                <div class="admin-badge">🔐 protected area</div>
            </div>
            <div class="login-body">
                <form id="loginForm" novalidate>
                    <div class="mb-4">
                        <div class="form-floating">
                            <input type="email" class="form-control" id="email" placeholder="admin@philtechgma.edu.ph" required>
                            <label for="email">Email address (admin)</label>
                            <div class="invalid-feedback" id="emailError"></div>
                        </div>
                    </div>
                    <div class="mb-4">
                        <div class="form-floating password-wrapper">
                            <input type="password" class="form-control" id="password" placeholder="Password" required>
                            <label for="password">Password</label>
                            <i class="bi bi-eye-slash password-toggle" id="togglePassword"></i>
                            <div class="invalid-feedback" id="passwordError"></div>
                        </div>
                    </div>
                    <div class="mb-4 d-flex justify-content-between align-items-center">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">Keep me signed in</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-maroon w-100 btn-login mb-3">
                        <span>Sign in as Administrator</span>
                    </button>
                    <div class="text-center mt-3">
                        <small class="text-secondary">© PhilTechGMA • Admin Console</small>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript (separate file) -->
    <script src="scripts/script.js"></script>
</body>
</html>
