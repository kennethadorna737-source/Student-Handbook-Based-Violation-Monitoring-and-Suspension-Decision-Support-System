<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Student Sign Up | PhilTechGMA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles/login.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card col-md-6 col-lg-5 col-xl-4">
            <div class="login-header">
                <img src="styles/image/logo.png" alt="Student Portal Logo" class="login-logo mb-3">
                <h2 class="mb-1">Student Sign Up</h2>
                <p class="branch-text mb-1">✦ Student Account Registration ✦</p>
                <p class="mb-0 opacity-75">Create your account and verify with email OTP</p>
                <div class="admin-badge">🎓 students only</div>
            </div>
            <div class="login-body">
                <form id="signupForm" novalidate>
                    <div class="mb-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="username" placeholder="Username" required>
                            <label for="username">Full Name (as in school records)</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="form-floating">
                            <input type="email" class="form-control" id="email" placeholder="student@email.com" required>
                            <label for="email">Email Address</label>
                        </div>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="course" placeholder="Course" value="BSCS" required>
                                <label for="course">Course (e.g., BSCS)</label>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-floating">
                                <input type="number" class="form-control" id="year" placeholder="Year" value="1" min="1" max="5" required>
                                <label for="year">Year Level</label>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-floating">
                                <select class="form-select" id="gender" required>
                                    <option value="">Select</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                                <label for="gender">Gender</label>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="form-floating password-wrapper">
                            <input type="password" class="form-control" id="password" placeholder="Password" minlength="8" required>
                            <label for="password">Password (min. 8 characters)</label>
                            <i class="bi bi-eye-slash password-toggle" id="togglePassword"></i>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="form-floating password-wrapper">
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>
                            <label for="confirmPassword">Confirm Password</label>
                            <i class="bi bi-eye-slash password-toggle" id="toggleConfirmPassword"></i>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-maroon w-100 btn-login mb-2" id="createAccountBtn">
                        <span>Create Student Account</span>
                    </button>
                </form>

                <form id="otpForm" class="mt-3 d-none">
                    <div class="mb-2 text-center">
                        <small class="text-secondary">Enter the OTP sent to your email</small>
                    </div>
                    <div class="mb-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="otpCode" placeholder="8-digit OTP" minlength="8" maxlength="8" inputmode="numeric" pattern="\d{8}" required>
                            <label for="otpCode">OTP Code</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-maroon w-100 mb-2" id="verifyOtpBtn">Verify OTP</button>
                    <button type="button" class="btn btn-outline-secondary w-100" id="resendOtpBtn">Resend OTP</button>
                </form>

                <div class="text-center mt-3">
                    <small class="text-secondary">Already have an account? <a href="login.html">Admin Login</a></small>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/signup.js"></script>
</body>
</html>
