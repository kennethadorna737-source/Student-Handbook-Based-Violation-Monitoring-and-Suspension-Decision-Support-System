<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Student Login | PhilTechGMA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles/login.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card col-md-6 col-lg-5 col-xl-4">
            <div class="login-header">
                <img src="styles/image/logo.png" alt="Student Portal Logo" class="login-logo mb-3">
                <h2 class="mb-1">Student Login</h2>
                <p class="branch-text mb-1">✦ Student Portal ✦</p>
                <p class="mb-0 opacity-75">Access your violation records and dashboard</p>
                <div class="admin-badge">🎓 students only</div>
            </div>
            <div class="login-body">
                <form id="studentLoginForm" novalidate>
                    <div class="mb-4">
                        <div class="form-floating">
                            <input type="email" class="form-control" id="email" placeholder="student@email.com" required>
                            <label for="email">Email address</label>
                            <div class="invalid-feedback" id="emailError"></div>
                        </div>
                    </div>
                    <div class="mb-4">
                        <div class="form-floating password-wrapper">
                            <input type="password" class="form-control" id="password" placeholder="Password" required>
                            <label for="password">Password</label>
                            <i class="bi bi-eye-slash password-toggle" id="togglePassword"></i>
                            <div class="invalid-feedback" id="passwordError"></div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-maroon w-100 btn-login mb-3" id="loginBtn">
                        <span>Sign in as Student</span>
                    </button>
                    <div class="text-center mb-2">
                        <small class="text-secondary">No account yet? <a href="signup.html">Register here</a></small>
                    </div>
                    <div class="text-center mb-2">
                        <small class="text-secondary">Admin? <a href="login.html">Admin Login</a></small>
                    </div>
                    <div class="text-center mt-3">
                        <small class="text-secondary">© PhilTechGMA • Student Portal</small>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/student-login.js"></script>
</body>
</html>
